name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check ${{ matrix.arch }} tier ${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64]
        tier: [0, 2]
    steps:
      - uses: actions/checkout@v6
      - name: Install the toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make qemu-system-arm qemu-system-riscv
      - name: Verify the toolchain
        run: |
          for t in clang ld.lld llvm-ar qemu-system-aarch64 qemu-system-riscv64; do
            command -v "$t" >/dev/null || { echo "missing from PATH: $t"; exit 1; }
          done
          clang --version | head -1
          qemu-system-aarch64 --version | head -1
          qemu-system-riscv64 --version | head -1
      - name: Build and smoke test
        run: make ARCH=${{ matrix.arch }} TIER=${{ matrix.tier }} check

  ci-ok:
    name: ci-ok
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to have passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "a check job did not pass: ${{ needs.check.result }}"
            exit 1
          fi
          echo "ci-ok: all four configs built and smoke tested"
